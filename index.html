<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where in the world?</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="container">
            <h1>Where in the world?</h1>
            <button id="theme-toggle">
                <i class="fa-regular fa-moon"></i>
                <span>Dark Mode</span>
            </button>
        </div>
    </header>

    <main>
        <div class="container controls-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search for a country...">
            </div>
            
            <div class="filter-wrapper">
                <select id="region-filter">
                    <option value="" selected disabled hidden>Filter by Region</option>
                    <option value="Africa">Africa</option>
                    <option value="Americas">Americas</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europe</option>
                    <option value="Oceania">Oceania</option>
                    <option value="">All</option>
                </select>
            </div>
        </div>

        <div class="container" id="countries-grid">
            <!-- Countries will be populated here -->
             <div class="loading">Loading countries...</div>
        </div>

        <div id="detail-modal" class="modal hidden">
            <button id="back-btn" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <div class="modal-content" id="modal-content">
                <!-- Detailed content will be injected here -->
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
